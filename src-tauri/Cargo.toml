[package]
name = "app"
version = "0.1.0"
description = "Engawa - A beginner-friendly terminal emulator"
authors = ["shiroino"]
license = "MIT"
repository = "https://github.com/shiroino/engawa"
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
portable-pty = "0.9"
tokio = { version = "1", features = ["full"] }
notify-debouncer-full = "0.7"
regex = "1.10"
reqwest = { version = "0.13.1", features = ["json", "default-tls"] }
async-trait = "0.1.89"
lru = "0.19.0"
sha2 = "0.11.0"
tauri-plugin-store = "2.4.2"
chrono = { version = "0.4.42", features = ["serde"] }
